services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: notifyflow
      POSTGRES_USER: notifyflow
      POSTGRES_PASSWORD: notifyflow
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data", "./db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U notifyflow -d notifyflow"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: notifyflow
      RABBITMQ_DEFAULT_PASS: notifyflow
    ports: ["5672:5672", "15672:15672"]
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 20

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      PORT: 3000
      DATABASE_URL: postgres://notifyflow:notifyflow@postgres:5432/notifyflow
      REDIS_URL: redis://redis:6379
      RABBITMQ_URL: amqp://notifyflow:notifyflow@rabbitmq:5672
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-mock}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-NotifyFlow <notifications@example.com>}
      FAIL_RATE: ${FAIL_RATE:-0.2}
    ports: ["3000:3000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 4s
      retries: 10
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    environment:
      DATABASE_URL: postgres://notifyflow:notifyflow@postgres:5432/notifyflow
      RABBITMQ_URL: amqp://notifyflow:notifyflow@rabbitmq:5672
      FAIL_RATE: ${FAIL_RATE:-0.2}
      EMAIL_TRANSPORT: ${EMAIL_TRANSPORT:-mock}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      EMAIL_FROM: ${EMAIL_FROM:-NotifyFlow <notifications@example.com>}
    depends_on:
      postgres: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    restart: unless-stopped

  dashboard:
    build:
      context: ./dashboard
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
    ports: ["8080:80"]
    depends_on:
      api: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1/ || exit 1"]
      interval: 10s
      timeout: 4s
      retries: 10
    restart: unless-stopped

volumes:
  postgres_data:
